services:
  postgres:
    image: postgres:17.5
    environment:
      POSTGRES_DB: reference_todo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reference_todo"]
      interval: 2s
      timeout: 2s
      retries: 30

  localstack:
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ap-northeast-1
      SQS_ENDPOINT_STRATEGY: path
    ports:
      - "${LOCALSTACK_PORT:-14566}:4566"
    volumes:
      - ./scripts/localstack:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name reference-todo-outbox >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30
