services:
  postgres:
    image: postgres:17.5
    environment:
      POSTGRES_DB: reference_todo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reference_todo"]
      interval: 2s
      timeout: 2s
      retries: 30
