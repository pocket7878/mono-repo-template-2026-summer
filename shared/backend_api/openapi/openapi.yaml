openapi: 3.0.0
info:
  title: Reference Todo API
  version: 0.0.0
tags:
  - name: Todos
paths:
  /todos:
    get:
      operationId: TodosList
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Todo'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorProblem'
      tags:
        - Todos
    post:
      operationId: TodosCreate
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BadRequestProblem'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorProblem'
      tags:
        - Todos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTodoRequest'
  /todos/{todoId}:
    patch:
      operationId: TodosUpdate
      parameters:
        - name: todoId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BadRequestProblem'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFoundProblem'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConflictProblem'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorProblem'
      tags:
        - Todos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTodoRequest'
    delete:
      operationId: TodosDelete
      parameters:
        - name: todoId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BadRequestProblem'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFoundProblem'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorProblem'
      tags:
        - Todos
components:
  schemas:
    BadRequestProblem:
      type: object
      allOf:
        - $ref: '#/components/schemas/Problem'
    ConflictProblem:
      type: object
      allOf:
        - $ref: '#/components/schemas/Problem'
    CreateTodoRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        dueDate:
          type: string
          format: date-time
    InternalServerErrorProblem:
      type: object
      allOf:
        - $ref: '#/components/schemas/Problem'
    NotFoundProblem:
      type: object
      allOf:
        - $ref: '#/components/schemas/Problem'
    Problem:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
    Todo:
      type: object
      required:
        - id
        - title
        - completed
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        title:
          type: string
        completed:
          type: boolean
        version:
          type: integer
          format: int32
        dueDate:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UpdateTodoRequest:
      type: object
      required:
        - version
      properties:
        title:
          type: string
        completed:
          type: boolean
        dueDate:
          type: string
          format: date-time
        version:
          type: integer
          format: int32
          minimum: 1
