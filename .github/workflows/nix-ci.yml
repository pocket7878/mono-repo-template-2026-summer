name: Nix CI

on:
  pull_request:
    paths: ["flake.nix", "flake.lock", ".envrc", ".github/workflows/nix-ci.yml"]

permissions:
  contents: read

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - run: nix flake check
      - run: nix develop --command bash -lc 'go version && node --version && terraform version && sqlc version && tflint --version'
