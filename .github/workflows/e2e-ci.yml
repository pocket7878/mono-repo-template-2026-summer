name: E2E CI

on:
  pull_request:
    paths: ["backend/**", "front/**", "shared/backend_api/**", "scripts/run-e2e-local.sh", "Makefile", "flake.nix", "flake.lock", ".envrc", ".github/workflows/e2e-ci.yml"]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.0
      - run: npm ci
        working-directory: front
      - run: npx playwright install --with-deps chromium
        working-directory: front
      - run: bash ./scripts/run-e2e-local.sh
