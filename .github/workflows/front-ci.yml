name: Frontend CI

on:
  pull_request:
    paths: ["front/**", "shared/backend_api/**", "Makefile", "flake.nix", "flake.lock", ".envrc", ".github/workflows/front-ci.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run fmt:check
      - name: Run scoped and changed high-risk coverage gates
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mapfile -t changed_files < <(git -C .. diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- 'front/**/*.ts' 'front/**/*.tsx')
          bash ./scripts/run_coverage_gate.sh "${changed_files[@]}"
      - run: npm run build
