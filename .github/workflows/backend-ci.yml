name: Backend CI

on:
  pull_request:
    paths: ["backend/**", "shared/backend_api/**", "Makefile", "flake.nix", "flake.lock", ".envrc", "scripts/check_generated_file_sync.py", ".github/workflows/backend-ci.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17.5
        env:
          POSTGRES_DB: reference_todo
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["15432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d reference_todo"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
      - run: gofmt -s -l . | (! grep .)
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.11.3
          working-directory: backend
      - run: go tool go-arch-lint check
      - run: go run ./cmd/backend-lint ./...
      - run: POSTGRES_TEST_DSN=postgres://postgres:postgres@127.0.0.1:15432/reference_todo?sslmode=disable ./scripts/run_coverage_gate.sh

  api-contract-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: |
            shared/backend_api/package-lock.json
            front/package-lock.json
      - run: npm ci
        working-directory: shared/backend_api
      - run: npm ci
        working-directory: front
      - run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
      - run: make check-gen

  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.5
        env:
          POSTGRES_DB: reference_todo_migration
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["15432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d reference_todo_migration"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
      - run: ./scripts/lint_migration_files.sh ./db/migrations
        working-directory: backend
      - run: go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.0
      - name: Verify up, down, and up migrations
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:15432/reference_todo_migration?sslmode=disable
        run: |
          migrate -path db/migrations -database "$DATABASE_URL" up
          migrate -path db/migrations -database "$DATABASE_URL" down -all
          migrate -path db/migrations -database "$DATABASE_URL" up
